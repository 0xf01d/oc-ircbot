# oc-ircbot — the three-container stack.
#
#   bot  (bridge)  ->  brain (OpenCode serve)  <-  watchdog (heartbeat+serve)
#
# The shared `botdata` volume carries bot.log / bot.send / events.log /
# brain.heartbeat / agent.status / workspace between the containers. Nothing
# here is secret except OPENCODE_API_KEY, which is passed through from the
# environment (documented in README.md); no key is committed.
#
# Single-network layout: one bot container on the implicit "irc" network
# (BOT_EVENTS / BOT_FIFO / BOT_LOG). For several IRC networks at once run
# one bot instance per network with its own files — see README.md,
# "Multi-network".

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: oc-ircbot-bot
    environment:
      IRC_HOST: ${IRC_HOST:-irc.azzurra.chat}
      IRC_PORT: ${IRC_PORT:-6697}
      IRC_NICK: ${IRC_NICK:-vjt-claude}
      IRC_IDENT: ${IRC_IDENT:-claude}
      IRC_REAL: ${IRC_REAL:-github.com/0xf01d/oc-ircbot}
      IRC_BIND: ${IRC_BIND:-}
      IRC_TLS: ${IRC_TLS:-1}
      IRC_TLS_VERIFY: ${IRC_TLS_VERIFY:-1}
      BOT_LOG: /data/bot.log
      BOT_FIFO: /data/bot.send
      BOT_EVENTS: /data/events.log
      NICKSERV_PASS: ${NICKSERV_PASS:-}
    volumes:
      - botdata:/data
    restart: unless-stopped

  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    image: oc-ircbot-brain
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      # Implicit single network (the one the bot container above serves).
      BOT_EVENTS: /data/events.log
      BOT_FIFO: /data/bot.send
      IRC_NICK: ${IRC_NICK:-vjt-claude}
      BRAIN_ADMIN: ${BRAIN_ADMIN:-admin}
      # Persistent serve + per-channel sessions live under /data.
      BRAIN_WORKDIR: /data/workspace
      BRAIN_MEMORY_DIR: /data/workspace/memory
      BRAIN_HEARTBEAT: /data/brain.heartbeat
      BRAIN_AGENT_STATUS: /data/agent.status
      BRAIN_MODEL: ${BRAIN_MODEL:-opencode/deepseek-v4.1-flash-free}
      BRAIN_SERVE_PORT: ${BRAIN_SERVE_PORT:-46099}
      # 0.0.0.0 so the watchdog container can poll serve health across the
      # compose network; the brain itself always talks to 127.0.0.1.
      BRAIN_SERVE_HOST: 0.0.0.0
      # Attach to an already-running serve instead of spawning one:
      # BRAIN_SERVE_URL: http://host:46099
      BRAIN_FROM_START: ${BRAIN_FROM_START:-0}
      BRAIN_POLL: ${BRAIN_POLL:-1.0}
      BRAIN_BATCH_WINDOW: ${BRAIN_BATCH_WINDOW:-3.0}
      BRAIN_RATE: ${BRAIN_RATE:-3.0}
      BRAIN_GLOBAL_RATE: ${BRAIN_GLOBAL_RATE:-1.0}
      BRAIN_MUTE: ${BRAIN_MUTE:-}
      BRAIN_ADDRESS_ONLY: ${BRAIN_ADDRESS_ONLY:-0}
    volumes:
      - botdata:/data
    depends_on:
      - bot
    restart: unless-stopped

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile.watchdog
    image: oc-ircbot-watchdog
    environment:
      BRAIN_HEARTBEAT: /data/brain.heartbeat
      BRAIN_AGENT_STATUS: /data/agent.status
      BRAIN_SERVE_URL: http://brain:${BRAIN_SERVE_PORT:-46099}
      WATCHDOG_POLL: ${WATCHDOG_POLL:-10}
      WATCHDOG_STALL: ${WATCHDOG_STALL:-30}
      WATCHDOG_MAX_STALLS: ${WATCHDOG_MAX_STALLS:-3}
      WATCHDOG_WEDGED: ${WATCHDOG_WEDGED:-300}
      WATCHDOG_SERVE_MAX_FAILS: ${WATCHDOG_SERVE_MAX_FAILS:-3}
      WATCHDOG_EXIT_ON_STALL: ${WATCHDOG_EXIT_ON_STALL:-0}
      # Lever of last resort; a sidecar cannot restart its own container in
      # Kubernetes, so this shell command is the honest escalation.
      WATCHDOG_RESTART_CMD: ${WATCHDOG_RESTART_CMD:-}
    volumes:
      - botdata:/data
    depends_on:
      - brain
    restart: unless-stopped

volumes:
  botdata:
