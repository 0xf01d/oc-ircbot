# Self-contained LIVE check pod: mock IRC + bot + real OpenCode brain, in one
# pod on an emptyDir. The brain spawns `opencode serve` itself (persistent
# sessions, no stub). Requires the API key (secret oc-ircbot-secrets key
# OPENCODE_API_KEY); see k8s/README.md. Not applied with the smoke manifests.
apiVersion: v1
kind: Pod
metadata:
  name: oc-live
  namespace: hermes-generated-content
  labels: {app: oc-live}
spec:
  restartPolicy: Never
  volumes:
    - {name: code, configMap: {name: oc-ircbot-code, defaultMode: 0555}}
    - {name: data, emptyDir: {}}
  containers:
    - name: mock-irc
      image: python:3.12-slim
      command:
        - python3
        - -u
        - /code/mock_irc_server.py
        - --host
        - 0.0.0.0
        - --port
        - "6667"
        - --inject
        - "#test hello bot, who are you?"
        - --out
        - /data/mock.out
        - --timeout
        - "600"
      volumeMounts:
        - {name: code, mountPath: /code, readOnly: true}
        - {name: data, mountPath: /data}
    - name: bot
      image: python:3.12-slim
      command: ["python3", "-u", "/code/bot.py"]
      env:
        - {name: IRC_HOST, value: "127.0.0.1"}
        - {name: IRC_PORT, value: "6667"}
        - {name: IRC_TLS, value: "0"}
        - {name: IRC_NICK, value: ocbot}
        - {name: BOT_LOG, value: /data/bot.log}
        - {name: BOT_FIFO, value: /data/bot.send}
        - {name: BOT_EVENTS, value: /data/events.log}
        - {name: BOT_TRUST, value: /code/bot.trust}
        - {name: BOT_RESERVED, value: /code/bot.reserved}
        - {name: BOT_STARTUP, value: /code/bot.startup}
        - {name: BOT_RESERVED_STORE, value: /data/reserved_recent.tsv}
      volumeMounts:
        - {name: code, mountPath: /code, readOnly: true}
        - {name: data, mountPath: /data}
    - name: brain
      image: node:22-slim
      command:
        - sh
        - -c
        - >-
          apt-get update &&
          apt-get install -y --no-install-recommends python3 ca-certificates &&
          npm install -g opencode-ai &&
          exec python3 -u /code/brain.py
      env:
        - {name: BOT_EVENTS, value: /data/events.log}
        - {name: BOT_FIFO, value: /data/bot.send}
        - {name: BRAIN_WORKDIR, value: /data/workspace}
        - {name: BRAIN_MEMORY_DIR, value: /data/workspace/memory}
        - {name: BRAIN_HEARTBEAT, value: /data/brain.heartbeat}
        - {name: BRAIN_AGENT_STATUS, value: /data/agent.status}
        - {name: BRAIN_MODEL, value: opencode/deepseek-v4.1-flash-free}
        - {name: IRC_NICK, value: ocbot}
        - {name: BRAIN_FROM_START, value: "1"}
        - {name: BRAIN_TURN_TIMEOUT, value: "180"}
        - name: OPENCODE_API_KEY
          valueFrom:
            secretKeyRef:
              name: oc-ircbot-secrets
              key: OPENCODE_API_KEY
              optional: true
      volumeMounts:
        - {name: code, mountPath: /code, readOnly: true}
        - {name: data, mountPath: /data}
