# oc-ircbot, live: the compose stack as one pod on irc.freebnc.net (#hermes).
#
#   brain (main: persistent OpenCode session, spawns `opencode serve`
#          on 127.0.0.1:46099)  <-  watchdog (sidecar, same netns)
#   bot (the IRC bridge; nets.py supervises one bot.py per network)
#
# Compose expressed `watchdog reaches the loopback-only serve` with
# network_mode: service:brain; in Kubernetes the three containers of one pod
# share the network namespace, so http://127.0.0.1:46099 just works.
#
# This file is the PRODUCTION manifest: it is what runs in the cluster, kept in
# sync by hand-checked commits (see README.md for the reconciliation rule). The
# shape below was captured from the live Deployment, not designed: /data is the
# shared PVC `lane-work` (NOT an emptyDir), because the network map, the
# per-network trust/startup files and every sidecar's state have to survive a
# rollout. `NETWORKS_FILE=/data/networks.json` makes that PVC copy the only
# source of truth; the ConfigMap does not carry a seed copy on purpose (two
# copies of the network map is exactly how label/mismatch double-bots happen).
#
# Code comes from the images (single multi-stage Dockerfile, three targets),
# NOT from a ConfigMap: the brain image carries the Node OpenCode CLI.
# Secrets are referenced, never committed: create oc-ircbot-secrets out of band
# — see README.md. Recreate (not RollingUpdate): one IRC connection, one nick,
# two pods would 433-flap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oc-ircbot
  namespace: hermes-generated-content
  labels:
    app: oc-ircbot
    tier: bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oc-ircbot
  template:
    metadata:
      labels:
        app: oc-ircbot
        tier: bridge
    spec:
      # nets.py SIGTERM path parts cleanly with a 10 s QUIT grace; leave
      # the default 30 s so it never gets SIGKILL mid-part.
      terminationGracePeriodSeconds: 30
      # /data is the shared PVC lane-work: the network map, per-network startup
      # files, logs and the FIFO set survive a rollout. Trust is NOT on it:
      # /conf (read-only ConfigMap) is the only trust source. Code is image-only.
      volumes:
        - name: conf
          configMap:
            name: oc-ircbot-live
            defaultMode: 0444
        - name: data
          persistentVolumeClaim:
            claimName: lane-work
        # /app and the rest of the image are read-only. Python and tmux still
        # need a scratch directory, and opencode keeps its auth/session DB and
        # tool cache under $HOME — those two paths get their own writable
        # emptydirs so readOnlyRootFilesystem does not break the brain.
        - name: tmp
          emptyDir: {}
        - name: opencode-state
          emptyDir: {}
        - name: opencode-cache
          emptyDir: {}
      containers:
        # --- main: the persistent-session brain ------------------------------
        - name: brain
          image: ghcr.io/0xf01d/oc-ircbot:brain
          imagePullPolicy: Always
          env:
            - {name: IRC_NICK, value: ocbot}
            - {name: BRAIN_ADMIN, value: katia}
            # One logical name (aisix) in front of the model ladder: the
            # gateway decides, the ladder is the failover order. Keeping the
            # ladder here, not in code, is what lets a dead free model be
            # demoted without a rebuild.
            - {name: BRAIN_MODEL, value: aisix/auto}
            - {name: BRAIN_MODEL_LADDER, value: "aisix/auto,aisix/go-glm-5.3-flash,aisix/glm-5.3-flash,aisix/claude-sonnet-5-5"}
            - {name: OC_MODEL, value: opencode/deepseek-v4.1-flash-free}
            - {name: OPENCODE_CONFIG, value: /data/oc/aisix.json}
            - {name: NETWORKS_FILE, value: /data/networks.json}
            # Code comes from the read-only image, never the writable PVC:
            # /data is data (logs, FIFOs, memory), not a source of executables.
            - {name: BRAIN_PLUGIN, value: /app/brain_plugin.py}
            # 21600 s age reset: hygiene, not amnesia. Compaction keeps the
            # live context lean; TURN_TIMEOUT 300 leaves room for a free
            # model that thinks for minutes before the abort fires.
            - {name: BRAIN_RESET_SECS, value: "21600"}
            - {name: BRAIN_TURN_TIMEOUT, value: "300"}
            # 0: an addressed line does NOT abort the running turn. Off on
            # purpose — preemption kept killing multi-minute turns mid-answer.
            - {name: BRAIN_PREEMPT_ON_ADDRESS, value: "0"}
            - name: AISIX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aisix-client-key
                  key: AISIX_API_KEY
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: oc-ircbot-secrets
                  key: OPENCODE_API_KEY
                  optional: true
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: TMPDIR, value: /tmp}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: opencode-state, mountPath: /root/.local/share/opencode}
            - {name: opencode-cache, mountPath: /root/.cache/opencode}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - >-
                  import os,sys,time;sys.exit(0 if
                  time.time()-os.path.getmtime('/data/brain.heartbeat')<120
                  else 1)
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 4
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "1", memory: 2Gi}

        # --- the IRC bridge ---------------------------------------------------
        - name: bot
          image: ghcr.io/0xf01d/oc-ircbot:bot
          imagePullPolicy: Always
          env:
            - {name: IRC_HOST, value: irc.freebnc.net}
            - {name: IRC_PORT, value: "6697"}
            - {name: IRC_TLS, value: "1"}
            - {name: IRC_TLS_VERIFY, value: "1"}
            - {name: IRC_NICK, value: ocbot}
            - {name: IRC_IDENT, value: ocbot}
            - {name: IRC_REAL, value: "ocbot"}
            - {name: BOT_TRUST, value: /conf/bot.trust}
            - {name: BOT_RESERVED, value: /conf/bot.reserved}
            - {name: BOT_STARTUP, value: /conf/bot.startup}
            # nets.py reads the PVC map, so a new network is a file edit
            - {name: NETWORKS_FILE, value: /data/networks.json}
            # Same rule as the brain: executable code is image-only. The old
            # PVC copies stay inert even if an injected shell rewrites them.
            - {name: BOT_HANDLERS, value: /app/handlers.py}
            - {name: BOT_IRC_COMMANDS, value: /app/irc_commands.py}
            - {name: OC_MODEL, value: opencode/glm-5.3-flash-free}
            - {name: BRAIN_MODEL, value: opencode/longcat-2.5-preview-free}
            - name: NICKSERV_PASS
              valueFrom:
                secretKeyRef:
                  name: oc-ircbot-secrets
                  key: NICKSERV_PASS
                  optional: true
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: TMPDIR, value: /tmp}
          volumeMounts:
            - {name: conf, mountPath: /conf, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}

        # --- the agent-aware sidecar (brain netns; serve is loopback-only) ---
        - name: watchdog
          image: ghcr.io/0xf01d/oc-ircbot:watchdog
          imagePullPolicy: Always
          env:
            - {name: BRAIN_SERVE_URL, value: "http://127.0.0.1:46099"}
            - {name: BRAIN_AGENT_STATUS, value: /data/agent.status}
            - {name: OC_MODEL, value: opencode/longcat-2.5-preview-free}
            - {name: BRAIN_MODEL, value: opencode/longcat-2.5-preview-free}
            - {name: WATCHDOG_POLL, value: "10"}
            - {name: WATCHDOG_STALL, value: "30"}
            - {name: WATCHDOG_MAX_STALLS, value: "3"}
            - {name: WATCHDOG_WEDGED, value: "300"}
            - {name: WATCHDOG_SERVE_MAX_FAILS, value: "3"}
            # A sidecar cannot restart its own container here; the honest
            # levers are the liveness probe (brain) and Recreate rollouts.
            - {name: WATCHDOG_EXIT_ON_STALL, value: "0"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: TMPDIR, value: /tmp}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
