                                     {"sessionID": sid, "info": {"id": sid}})
                        self._json(200, {"id": sid, "title": body.get("title", "")})
                    elif re.match(r"^/session/[^/]+/prompt_async$", self.path):
                        sid = self.path.split("/")[2]
                        text = "".join(p.get("text", "")
                                       for p in body.get("parts", [])
                                       if p.get("type") == "text")
                        with st.lock:
                            sess = st.sessions.get(sid)
                            if sess is None:
                                self._json(404, {"error": "no session"})
                                return
                            sess["busy"] = True
                            msg_id = f"msg_u{time.time_ns()}"
                            sess["messages"].append(
                                {"info": {"id": msg_id, "role": "user"},
                                 "parts": [{"type": "text", "text": text}]})
                        st.broadcast("session.status",
                                     {"sessionID": sid,
                                      "status": {"type": "busy"}})
                        threading.Thread(target=serve._run_turn,
                                         args=(sid, text), daemon=True).start()
                        self.send_response(204)
                        self.end_headers()
                    elif re.match(r"^/session/[^/]+/abort$", self.path):
                        sid = self.path.split("/")[2]
                        with st.lock:
                            st.aborted.add(sid)
                            sess = st.sessions.get(sid)
                            if sess:
                                sess["busy"] = False
                        self._json(200, True)
                    elif re.match(r"^/permission/[^/]+/reply$", self.path):
                        req_id = self.path.split("/")[2]
                        with st.lock:
                            st.permission_replies.append((req_id, body))
                        self._json(200, True)
                    else:
                        self._json(404, {"error": "not found"})

                def _sse(self):
                    st = serve.state
                    self.send_response(200)
                    self.send_header("content-type", "text/event-stream")
                    self.send_header("cache-control", "no-cache")
                    self.end_headers()
                    self.wfile.write(b"data: "
                                     b'{"type":"server.connected",'
                                     b'"properties":{}}\n\n')
                    self.wfile.flush()
                    sent = 1
                    while True:
                        with st.event_cond:
                            while (len(st.events) <= sent
                                   and not getattr(self.server, "stop", False)):
                                st.event_cond.wait(timeout=0.5)
                            if len(st.events) <= sent:
                                return
                            ev = st.events[sent]
                            sent += 1
                        try:
                            self.wfile.write(
                                f"data: {json.dumps(ev)}\n\n".encode())
                            self.wfile.flush()
                        except (OSError, ValueError):
                            return

            self.httpd = ThreadingHTTPServer((host, port), Handler)
            self.httpd.daemon_threads = True
            self.httpd.stop = False
            self.port = self.httpd.server_address[1]
            self.url = f"http://{host}:{self.port}"

        def _run_turn(self, sid, prompt):
            time.sleep(self.turn_delay)
            st = self.state
            if sid in st.aborted:
                return
            answer = self.answer(prompt, st)
            amsg = {"info": {"id": f"msg_a{time.time_ns()}",
                             "role": "assistant"},
                    "parts": [{"type": "text", "text": answer}]}
            with st.lock:
                sess = st.sessions.get(sid)
                if sess is None:
                    return
                sess["messages"].append(amsg)
                sess["busy"] = False
            st.broadcast("session.status",
                         {"sessionID": sid, "status": {"type": "idle"}})
            st.broadcast("message.updated",
                         {"sessionID": sid, "info": amsg["info"]})
            st.broadcast("session.idle", {"sessionID": sid})

        def start(self):
            threading.Thread(target=self.httpd.serve_forever, daemon=True).start()
            return self

        def serve_forever(self):
            self.httpd.serve_forever()

        def stop(self):
            self.httpd.stop = True
            with self.state.event_cond:
                self.state.event_cond.notify_all()
            self.httpd.shutdown()
            self.httpd.server_close()

        def permission_denied_count(self):
            return len(self.state.permission_replies)


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--host", default="0.0.0.0")
        ap.add_argument("--port", type=int, default=46099)
        a = ap.parse_args()
        serve = StubServe(host=a.host, port=a.port)
        print(f"stub opencode serve on {serve.url}", flush=True)
        serve.serve_forever()


    if __name__ == "__main__":
        main()
  bot.say: |
    #!/bin/sh
    # bot.say — write to the bot.send FIFO without a quoting footgun.
    #
    # printf into the FIFO breaks on the things people actually type: a bare '%'
    # eats the next word as a format specifier, and apostrophes and accents have
    # to survive a layer of shell quoting. bot.say takes the body on STDIN, so
    # only the target (a simple token) is ever a shell argument:
    #
    #     ./bot.say '#mychannel' <<'EOF'
    #     100% d'accordo — accents, apostrophes and percent signs all arrive intact
    #     EOF
    #
    #     ./bot.say -v ACT '#mychannel' <<'EOF'   # any verb: ACT, NOTICE, ...
    #     waves
    #     EOF
    #
    # Each non-empty stdin line becomes one message, so a heredoc sends several.
    # -f <path> points it at a different FIFO (the second-instance case).
    set -eu

    verb=SAY
    fifo=${BOT_FIFO:-bot.send}

    while [ $# -gt 0 ]; do
        case "$1" in
            -v) verb="$2"; shift 2 ;;
            -f) fifo="$2"; shift 2 ;;
            --) shift; break ;;
            -h|--help)
                echo "usage: bot.say [-v VERB] [-f FIFO] <target>  (body on stdin)" >&2
                exit 0 ;;
            -*) echo "bot.say: unknown option: $1" >&2; exit 2 ;;
            *) break ;;
        esac
    done

    target=${1:-}
    if [ -z "$target" ]; then
        echo "usage: bot.say [-v VERB] [-f FIFO] <target>  (body on stdin)" >&2
        exit 2
    fi

    while IFS= read -r line; do
        [ -n "$line" ] || continue
        printf '%s %s %s\n' "$verb" "$target" "$line"
    done >> "$fifo"
  bot.startup: |
