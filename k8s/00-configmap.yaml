                            sessions = list(st.sessions.values())
                        self._json(200, sessions)
                    elif self.path == "/session/status":
                        with st.lock:
                            busy = {sid: {"type": "busy"}
                                    for sid, s in st.sessions.items()
                                    if s.get("busy")}
                        self._json(200, busy)
