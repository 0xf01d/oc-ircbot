            send_raw(f"NOTICE {target} :{text}", origin)
        elif verb == "JOIN":
            send_raw(f"JOIN {rest}", origin)
        elif verb == "PART":
            send_raw(f"PART {rest}", origin)
        elif verb == "WHOIS":
            send_raw(f"WHOIS {rest}", origin)
